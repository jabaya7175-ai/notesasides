# Notes & Asides Studio — iPad and iPhone app: a native shell around the Studio web app.
# Generated with XcodeGen on GitHub's cloud Macs (see .github/workflows/ios.yml).
name: NotesAsidesStudio
options:
  bundleIdPrefix: com.notesasides
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ${NA_TEAM_ID}
    CODE_SIGN_STYLE: Automatic
targets:
  Studio:
    type: application
    platform: iOS
    sources: [App]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: N&A Studio
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        UILaunchScreen:
          UIColorName: LaunchInk
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Photograph a page or a drawing to put it on the drafting board.
        NSPhotoLibraryUsageDescription: Add photos to the drafting board and to posts.
        CFBundleURLTypes:
          - CFBundleURLName: com.notesasides.studio
            CFBundleURLSchemes: [notesasides-studio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.notesasides.studio
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: NA Studio CI App
